<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>شاهد خريطة الشهادة</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700;900&family=Noto+Sans+Arabic:wght@300;400;600&family=Courier+Prime:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  />

  <!-- Our CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-title">شاهد</div>
    <div class="loading-sub">Lebanon War Map</div>

    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>


  <!-- Application -->
  <div id="app">

    <!-- Top Bar -->
    <header id="topbar">

      <div class="brand">

        <button
          id="sidebar-toggle"
          type="button"
          title="عرض القرى"
        >
          ☰
        </button>

        <div>
          <div class="logo">شاهد</div>
          <div class="logo-sub">SHAHED</div>
        </div>

        <div class="divider"></div>

        <div class="channel-tag">
          @bintjbeilnews
        </div>

      </div>


      <div id="stats-bar">

        <div class="stat-item">
          <span
            class="stat-value"
            id="stat-villages"
          >
            -
          </span>

          <span class="stat-label">
            قرية
          </span>
        </div>


        <div class="stat-item">
          <span
            class="stat-value"
            id="stat-attacks"
          >
            —
          </span>

          <span class="stat-label">
            غارة
          </span>
        </div>


        <div id="live-dot">
          <div class="pulse-dot"></div>
          LIVE
        </div>

      </div>

    </header>


    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay"></div>


    <!-- Sidebar -->
    <aside id="sidebar">

      <div id="sidebar-header">

        <h2>
          القرى او المدن الموثّقة
        </h2>

        <input
          id="search-input"
          type="text"
          placeholder="ابحث عن قرية..."
          autocomplete="off"
        />

      </div>


      <div id="village-list"></div>


      <div id="sidebar-footer">

        <div class="footer-text">
          البيانات من قناة @bintjbeilnews
        </div>

      </div>

    </aside>


    <!-- Map Container -->
    <div id="map-container">

      <div id="map"></div>


      <!-- Zoom Controls -->
      <div id="zoom-controls">

        <button
          class="zoom-btn"
          id="zoom-in"
          title="تكبير"
        >
          +
        </button>

        <button
          class="zoom-btn"
          id="zoom-out"
          title="تصغير"
        >
          −
        </button>

      </div>


      <!-- Legend Button -->
      <button
        id="legend-toggle"
        title="مفتاح الخريطة"
      >
        ●
      </button>


      <!-- Legend -->
      <div id="map-legend">

        <h4>
          مفتاح الخريطة
        </h4>

        <div class="legend-item">
          <div
            class="legend-dot"
            style="width:7px;height:7px;background:#ffd700;box-shadow:0 0 8px #ffd700"
          ></div>

          <span class="legend-label">
            1-2 غارة
          </span>
        </div>


        <div class="legend-item">
          <div
            class="legend-dot"
            style="width:11px;height:11px;background:#ff8c00;box-shadow:0 0 12px #ff8c00"
          ></div>

          <span class="legend-label">
            3-9 غارات
          </span>
        </div>


        <div class="legend-item">
          <div
            class="legend-dot"
            style="width:16px;height:16px;background:#ff5500;box-shadow:0 0 16px #ff5500"
          ></div>

          <span class="legend-label">
            10-19 غارة
          </span>
        </div>


        <div class="legend-item">
          <div
            class="legend-dot"
            style="width:22px;height:22px;background:#ff2d2d;box-shadow:0 0 22px #ff2d2d"
          ></div>

          <span class="legend-label">
            20-49 غارة
          </span>
        </div>


        <div class="legend-item">
          <div
            class="legend-dot"
            style="width:30px;height:30px;background:#8b0000;box-shadow:0 0 30px #8b0000"
          ></div>

          <span class="legend-label">
            +50 غارة
          </span>
        </div>

      </div>


      <!-- Empty State -->
      <div
        id="empty-state"
        style="display:none"
      >

        <div class="empty-icon">
          🗺
        </div>

        <div class="empty-text">
          NO DATA YET
        </div>

      </div>


      <!-- Detail Panel -->
      <div id="detail-panel">

        <button id="detail-close">
          ✕
        </button>


        <div id="detail-header">

          <div id="detail-village-ar">
            -
          </div>

          <div id="detail-village-en">
            -
          </div>


          <div id="detail-attack-count">

            <span
              class="count-num"
              id="detail-count-num"
            >
              0
            </span>

            <span class="count-label">
              غارة موثّقة
            </span>

          </div>

        </div>


        <div id="detail-body">

          <div class="detail-section-title">
            آخر رسالة
          </div>

          <div id="last-message-box">
            -
          </div>


          <div class="detail-section-title">
            الشهادات
          </div>

          <div id="testimonies-list"></div>


          <div class="detail-section-title">
            أضف شهادتك
          </div>


          <div id="testimony-form">

            <textarea
              id="testimony-input"
              placeholder="اكتب شهادتك هنا... ما رأيته، ما سمعته، ما عشته."
            ></textarea>

            <button id="testimony-submit">
              أرسل شهادتك
            </button>

            <div id="submit-feedback"></div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="./app.js"></script>

</body>
</html>
